<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <div class="left-side">
        <img src="./img/image-1.jpg" class="leaves" alt="some leaves in the forest in the rain">
        <div class="logo-container">
            <img src="./img/logo.png" alt="" class="logo">
            <div class="logo-text">Flux</div>
        </div>
    </div>
    <div class="right-side">
        <div class="call-to-action padding-adj">
            <p> This is not a real service! </p>
            <p> Sign-up Flux Track and make more progress with less motion. </p>
        </div>
        <form action="#" method="get">
            <fieldset class="padding-adj">
                <h1> Let's do this! </h1>
                <div>
                    <div>
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first-name" placeholder="First Name" required autocomplete="given-name">
                    </div>
                    <div>
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last-name" placeholder="Last Name" required autocomplete="family-name">
                    </div>
                </div>
    
                <div>
                    <div>
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Email" required autocomplete="email">
                    </div>
                    <div>
                        <label for="telnumber">Phone Number</label>
                        <input type="tel" 
                        id="telnumber" 
                        name="telnumber" 
                        placeholder="Phone Number" 
                        required 
                        autocomplete="tel"
                        maxlength="15"
                        pattern="[0-9]{7,}"
                        />
                    </div>
                </div>
                
                <div>
                    <div>
                        <label for="password">Password</label>
                        <input type="password" 
                        id="password"
                        name="password" 
                        placeholder="Password" 
                        required
                        pattern="(?=.*[A-Z].+)(.*\d.*)"
                        minlength="5"
                        title="Password must be at least 5 characters and include an uppercase letter."
                        />
                    </div>
                    <div>
                        <label for="passwordconfirm">Password confirm</label>
                        <input 
                        type="password" 
                        id="passwordconfirm" 
                        name="passwordconfirm"
                        placeholder="Password" 
                        required
                        pattern="(?=.*[A-Z].+)(.*\d.*)"
                        minlength="5"
                        title="Password must be at least 5 characters and include an uppercase letter."
                        />
                    </div>
                </div>
                <div>
                    <p>Password must be at least 5 characters and include an uppercase letter.</p>                
                </div>
            </fieldset>
            <div class="submit padding-adj">
                <button type="submit" class="btn">Create Account</button>
                <div> Already have an account? <a href="#">Log in</a></div>
            </div>
        </form>
    </div>
</body>
</html>
